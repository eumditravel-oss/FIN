<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FIN 산출프로그램</title>

  <!-- 스타일 -->
  <link rel="stylesheet" href="styles.css?v=15" />
</head>
<body>
  <!-- ======================
       Topbar
       ====================== -->
  <header class="topbar">
    <div class="brand">
      <div class="title">Viet QS FIN 산출프로그램</div>
      <div class="sub">Viet QS x Con-cost Tool</div>
    </div>

    <!-- ✅ Project strip (프로젝트 UI) -->
    <div class="project-strip">
      <button id="btnProjectOpen" class="btn project">프로젝트 열기</button>
      <div class="project-meta">
        <div id="projectName" class="project-name">프로젝트 미선택</div>
        <div id="projectCode" class="project-code">공사코드 -</div>
      </div>
    </div>

    <div class="actions">
      <button id="btnHelp" class="btn help" title="도움말">도움말</button>
      <button id="btnOpenPicker" class="btn">코드 선택 (Ctrl+.)</button>
      <button id="btnExport" class="btn">내보내기(EXCEL)</button>

      <label class="btn ghost">
        가져오기(EXCEL)
        <input
          id="fileImport"
          type="file"
          accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          hidden
        />
      </label>

      <button id="btnReset" class="btn danger">초기화</button>
    </div>
  </header>

  <!-- ======================
       Tabs
       ====================== -->
  <nav class="tabs" id="tabs"></nav>

  <!-- ======================
       Main Content
       ====================== -->
  <main class="content">
    <section id="view" class="view-fill"></section>
  </main>

  <!-- ======================
       Footer
       ====================== -->
  <footer class="footer">
    <div>
      ※ 집계 탭: “할증전수량/할증후수량” 코드별 합계 ·
      (구분 개소 반영, 환산단위/계수 있으면 환산후수량 기준)
    </div>
  </footer>

  <!-- ======================
       ✅ Project Modal (필수 DOM)
       ====================== -->
  <div id="projectModal" class="project-modal" hidden>
    <div class="project-modal-card">
      <div class="project-modal-head">
        <div class="project-modal-title">프로젝트 관리</div>
        <div class="project-modal-actions">
          <button id="btnProjectAdd" class="smallbtn">+ 프로젝트 추가</button>
          <button id="btnProjectClose" class="smallbtn">닫기</button>
        </div>
      </div>

      <div class="project-modal-body">
        <div class="project-modal-desc">
          - 프로젝트를 “열기” 하면 해당 프로젝트 데이터가 활성화됩니다.<br/>
          - “저장”으로 프로젝트명/공사코드를 수정할 수 있습니다.
        </div>

        <div id="projectList" class="project-list"></div>
      </div>
    </div>
  </div>

  <!-- ======================
       Libraries
       ====================== -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- App -->
  <script src="app.js?v=21"></script>
</body>
</html>
