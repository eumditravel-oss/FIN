<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FIN 산출프로그램</title>

  <!-- 스타일 -->
  <link rel="stylesheet" href="styles.css?v=15" />
</head>
<body>
  <!-- ======================
       Topbar
       ====================== -->
  <header class="topbar">
    <div class="brand">
      <div class="title">Viet QS FIN 산출프로그램</div>
      <div class="sub">Viet QS x Con-cost Tool</div>
    </div>

    <!-- ✅ 프로젝트 열기 -->
    <div class="project-slot">
      <!-- ✅ app.js와 id 맞춤: btnProjectOpen 을 topbar 버튼으로 사용 -->
      <button id="btnProjectOpen" class="btn btn-project" title="프로젝트 선택/관리">
        프로젝트 열기
      </button>

      <!-- ✅ app.js와 id 맞춤: projectName / projectCode -->
      <div class="project-badge" title="현재 프로젝트">
        <span id="projectName">(미선택)</span>
        <span class="sep">·</span>
        <span id="projectCode">공사코드 -</span>
      </div>
    </div>

    <div class="actions">
      <button id="btnHelp" class="btn help" title="도움말">도움말</button>

      <!-- ✅ 프로젝트 선택 전에는 비활성 -->
      <button id="btnOpenPicker" class="btn" disabled>코드 선택 (Ctrl+.)</button>
      <button id="btnExport" class="btn" disabled>내보내기(EXCEL)</button>

      <!-- ✅ label 자체는 그대로 두되, app.js에서 pointer-events/opacity를 제어하지 않으므로
           초기 상태만 잠금 + 프로젝트 선택 시 app.js가 fileImport disabled만 풀어줌 -->
      <label class="btn ghost" id="btnImportWrap" aria-disabled="true" style="opacity:.55; pointer-events:none;">
        가져오기(EXCEL)
        <input
          id="fileImport"
          type="file"
          accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          hidden
          disabled
        />
      </label>

      <button id="btnReset" class="btn danger" disabled>초기화</button>
    </div>
  </header>

  <!-- ======================
       Tabs
       ====================== -->
  <nav class="tabs" id="tabs"></nav>

  <!-- ======================
       Main Content
       ====================== -->
  <main class="content">
    <section id="view" class="view-fill"></section>
  </main>

  <!-- ======================
       Footer
       ====================== -->
  <footer class="footer">
    <div>
      ※ 집계 탭: “할증전수량/할증후수량” 코드별 합계 ·
      (구분 개소 반영, 환산단위/계수 있으면 환산후수량 기준)
    </div>
  </footer>

  <!-- ======================
       프로젝트 열기 모달
       ====================== -->
  <!-- ✅ app.js는 hidden 속성으로 열고/닫으므로 hidden 기본값 적용 -->
  <div id="projectModal" class="modal" hidden>
    <!-- ✅ app.js: 모달 배경 클릭 닫기 로직을 projectModal 자체 click으로 처리
         (e.target === projectModal) 이므로 backdrop이 projectModal의 직접 자식이어야 함 -->
    <div class="modal-card modal-wide" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
      <div class="modal-head">
        <div class="modal-title" id="projectModalTitle">프로젝트 열기</div>
        <div class="modal-head-actions">
          <!-- ✅ app.js에서 쓰는 id: btnProjectAdd / btnProjectClose 만 존재 -->
          <button id="btnProjectAdd" class="btn">추가</button>
          <button id="btnProjectClose" class="btn">닫기</button>
        </div>
      </div>

      <div class="modal-body">
        <div class="project-hint">
          공사코드/프로젝트명 수정 → 저장 → “열기”로 적용됩니다.
          (현재는 로컬 저장 / 추후 서버 연결로 다중 사용자 확장 가능)
        </div>

        <!-- ✅ app.js가 찾는 id: projectList -->
        <div id="projectList" class="project-list">
          <!-- app.js에서 렌더 -->
        </div>
      </div>

      <div class="modal-foot">
        <div class="muted">
          * 프로젝트가 선택되면, 아래의 “코드선택/내보내기/가져오기/초기화”는 해당 프로젝트 하위로 관리됩니다.
        </div>
      </div>
    </div>
  </div>

  <!-- ======================
       Libraries
       ====================== -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- App -->
  <script src="app.js?v=21"></script>
</body>
</html>
